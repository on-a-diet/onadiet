packages:
  - 'packages/*'

# Single source of truth for shared tooling versions — every package.json references these as
# "catalog:". Bump here once; pnpm applies it everywhere.
#
# TypeScript is deliberately HELD at ~6.0: typescript-eslint 8.64 peers `typescript >=4.8.4 <6.1.0`, so
# TS 7 breaks the type-aware lint stack. Taking TS 7 needs a coordinated typescript-eslint major bump —
# do that as its own change, not a routine dependency bump.
catalog:
  typescript: ~6.0.3
  tsup: ^8.5.1
  vite: ^8.3.0
  vitest: ^5.0.1
  '@types/node': ^22.20.2
  eslint: ^10.10.0
  '@eslint/js': ^10.0.1
  typescript-eslint: ^8.70.0
  prettier: ^3.9.6
  dependency-cruiser: ^18.3.1
  turbo: ^2.10.13
  '@changesets/cli': ^3.0.3
  husky: ^9.1.7
  lint-staged: ^17.5.1

# @types/node follows the RUNTIME FLOOR (engines: >=22, .nvmrc 22), not the newest Node. It was on 26, which
# type-checks calls to APIs that do not exist on Node 22 — code that compiles cleanly and then fails at
# runtime on the oldest version this package claims to support. Move it with the floor, never ahead of it.

# Supply-chain cooldown: never resolve a version published less than 7 days ago. A compromised release is
# usually caught and yanked within days, so a short delay buys most of the protection for almost none of the
# freshness. 7 days matches the handbook's reference project; pnpm's own default is 1 day. In MINUTES.
# pnpm 12 rejects an unrecognised key here rather than ignoring it, so a misspelling cannot silently drop
# this policy. (Dependabot's own cooldown in .github/dependabot.yml is 30 days — stricter about what it
# PROPOSES; this is the floor on what pnpm will INSTALL.)
minimumReleaseAge: 10080

# Dependency install scripts are OFF unless listed here (pnpm 11+ fails the install on any that are neither
# allowed nor denied). esbuild's postinstall only re-verifies — and if missing, downloads — the native binary
# it already ships as an optional per-platform package, so it is denied: no third-party code runs at install
# time for a job this repo does not need.
allowBuilds:
  esbuild: false
